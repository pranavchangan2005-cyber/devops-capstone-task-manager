
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Manager</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 40px 16px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 25px #00000012;
        }

        h1 { margin-top: 0; color: #2563eb; }
        .subtitle { color: #64748b; }

        form {
            display: flex;
            gap: 10px;
            margin: 24px 0;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        button:disabled { opacity: .5; cursor: wait; }
        ul { padding: 0; list-style: none; }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        li span { flex: 1; overflow-wrap: anywhere; }
        li span.completed { text-decoration: line-through; color: #64748b; }
        li button { background: #dc2626; }
        .status { color: #475569; font-size: 14px; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
    <main class="container">
        <h1>DevOps Task Manager</h1>
        <p class="subtitle">A full-stack application powered by Docker.</p>

        <form id="task-form">
            <input id="task-title" type="text"
                   placeholder="Enter a new task..." required maxlength="255">
            <button id="add-button" type="submit">Add Task</button>
        </form>

        <p id="status" class="status" role="status">Loading tasks...</p>
        <ul id="task-list"></ul>
    </main>

    <script>
        const API = "/api/tasks";
        const form = document.getElementById("task-form");
        const input = document.getElementById("task-title");
        const list = document.getElementById("task-list");
        const status = document.getElementById("status");
        const addButton = document.getElementById("add-button");

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...options.headers
                }
            });

            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.error || `Request failed (${response.status})`);
            }

            return response.json();
        }

        async function loadTasks() {
            status.classList.remove("error");

            try {
                const tasks = await apiRequest(API);
                list.replaceChildren();

                tasks.forEach(task => {
                    const item = document.createElement("li");
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.checked = task.completed;
                    checkbox.setAttribute("aria-label", "Mark task complete");

                    const title = document.createElement("span");
                    title.textContent = task.title;
                    title.classList.toggle("completed", task.completed);

                    checkbox.addEventListener("change", async () => {
                        checkbox.disabled = true;
                        try {
                            await apiRequest(`${API}/${task.id}`, {
                                method: "PATCH",
                                body: JSON.stringify({ completed: checkbox.checked })
                            });
                            await loadTasks();
                        } catch (error) {
                            checkbox.checked = !checkbox.checked;
                            showError(error);
                            checkbox.disabled = false;
                        }
                    });

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.addEventListener("click", async () => {
                        deleteButton.disabled = true;
                        try {
                            await apiRequest(`${API}/${task.id}`, {
                                method: "DELETE"
                            });
                            await loadTasks();
                        } catch (error) {
                            showError(error);
                            deleteButton.disabled = false;
                        }
                    });

                    item.append(checkbox, title, deleteButton);
                    list.appendChild(item);
                });

                status.textContent = `${tasks.length} task(s)`;
            } catch (error) {
                showError(error);
            }
        }

        function showError(error) {
            status.textContent = error.message;
            status.classList.add("error");
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            const title = input.value.trim();
            if (!title) return;

            addButton.disabled = true;

            try {
                await apiRequest(API, {
                    method: "POST",
                    body: JSON.stringify({ title })
                });
                input.value = "";
                await loadTasks();
            } catch (error) {
                showError(error);
            } finally {
                addButton.disabled = false;
            }
        });

        loadTasks();
    </script>
</body>
</html>
